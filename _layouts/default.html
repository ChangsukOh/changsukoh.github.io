<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>{{ site.title }}</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      color: #222;
      line-height: 1.7;
      margin: 0;
      background: white;
    }

    .container {
      max-width: 760px;
      margin: 50px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 32px;
      text-align: center;
    }

    h2 {
      font-size: 23px;
      margin-top: 35px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }

    a {
      color: #1772d0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    img {
      max-width: 100%;
    }
  </style>
</head>

<body>
  <main class="container">
    {{ content }}
  </main>
</body>
</html>
